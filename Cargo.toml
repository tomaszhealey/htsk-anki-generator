[package]
name = "htsk-anki-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.19.0"
reqwest = "0.13.4"
tokio = {version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
clap = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 'z'     
lto = true         
codegen-units = 1 
panic = 'abort'  
strip = true    
